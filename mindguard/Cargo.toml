[workspace]
resolver = "3"
members = [
    "crates/mindguard-protector",
    "crates/mindguard-runtime-rust",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
clap = { version = "4.6.5", features = ["derive"] }
ed25519-dalek = "2.2.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.19"
